[project]
name = "markdowns-organizer"
version = "0.1.0"
description = "Streamlit app to organize markdown data into folders"
authors = [
    {name = "siddarthasagar", email = "siddarthasagar@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.43.1,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "huggingface-hub>=0.35.0,<1.0.0",
    "ijson>=3.3.0,<4.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]

[project.scripts]
llm-hosting-data = "llm_hosting_data.cli:main"

[dependency-groups]
dev = [
    "pyupgrade>=3.21.2",
    "pytest>=8.3.0",
    "ruff>=0.15.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markdowns_organizer", "src/llm_hosting_data"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["E501", "CPY001", "D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"src/llm_hosting_data/cli.py" = ["T201"]
"tests/*" = ["S101", "S106", "D100", "D103", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
