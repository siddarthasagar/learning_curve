# Baseline model slugs for OpenRouter's benchmarks API, and for the
# model<->instance comparison report (model_instance_fit.py).
#
# OpenRouter identifies models by a dated permaslug (e.g.
# "anthropic/claude-sonnet-5-20260630") that changes as new snapshots get
# evaluated -- every slug below is matched as a case-insensitive substring
# against model_permaslug, not an exact ID, so it keeps resolving as
# OpenRouter re-dates its entries.
#
# There is deliberately no "candidates:" list here. The `compare` subcommand
# auto-derives candidates instead -- every OpenRouter model family (release
# date stripped) that matches at least one repo already in
# config/hf_models.yaml's resolved candidate pool automatically gets
# compared, with no second hand-typed list to keep in sync as collections
# change (2026-08-19, user request). Only the baseline needs a slug here: a
# closed-source model has no HF repo to auto-derive it from.
#
# Usage: uv run llm-hosting-data benchmarks --config config/benchmark_models.yaml
#        uv run llm-hosting-data compare --benchmark-config config/benchmark_models.yaml

baseline:
  - anthropic/claude-sonnet-5
