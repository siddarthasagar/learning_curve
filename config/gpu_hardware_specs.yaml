# Per-GPU physical hardware specs, by AWS instance family. Used by both
# gpu_reference.py (memory bandwidth + NVLink, merged into the Vantage-backed
# GPU catalog at lookup time) and model_instance_fit.py (nameplate memory,
# for the tight/best-fit capacity calculation) -- a single shared source of
# truth for what were previously two independent, possibly-drifting tables.
#
# Externalized as data rather than a Python constant (2026-08-19, user
# request, following the same pattern as config/kernel_support_matrix.yaml):
# these are physical hardware facts, fixed once a card ships -- unlike
# kernel/software support (config/kernel_support_matrix.yaml) they need no
# live source or update pipeline. A static, source-cited list is the
# reliable answer here, not an API (2026-08-20, user request: "hardware
# specs anyway are not going to change... if it's from nvidia's document
# page there is no questioning the data").
#
# Enriched 2026-08-20 from config/nvidia_gpu_specs.yaml -- a separate,
# GPU-model-keyed raw citation archive the user hand-gathered directly from
# NVIDIA's own product pages (kept as-is; this file re-derives the clean,
# per-AWS-family, unit-normalized numbers a human or the code can read
# without re-parsing prose). Every entry below carries its own `source`.
#
# Tensor Core figures are included as direct *evidence* of native hardware
# format support, not just performance trivia (2026-08-20, user's own
# observation): a GPU with a published FP8 Tensor Core TFLOPS figure has
# FP8 silicon; a GPU with no such figure on its own spec page doesn't (e.g.
# A100 below has no fp8_tflops at all -- NVIDIA's page simply doesn't list
# one, which independently corroborates doc 04 §5 fact 1, "A100 has no FP8
# silicon"). `native_precision_support` makes that reading explicit per
# entry, cross-checked against doc 04 §5's own "Native HW" row rather than
# inferred from Tensor Core figures alone (some formats, e.g. INT4 Marlin,
# are native without getting their own headline Tensor Core TFLOPS number).
#
# Fields (any may be null when a source genuinely doesn't have the number --
# never guessed):
#   memory_gb_per_gpu       - nameplate VRAM per GPU, decimal GB.
#   memory_bandwidth_gbps   - GB/s.
#   nvlink_generation       - e.g. "NVLink3"/"NVLink4"/"NVLink5", null if no NVLink.
#   nvlink_bandwidth_gbps   - GB/s, null under the same conditions.
#   gpu_model               - NVIDIA's own product name.
#   architecture            - e.g. "Ampere", "Hopper", "Blackwell".
#   form_factor             - e.g. "SXM4", "PCIe", "SXM (8-GPU HGX baseboard)".
#   tensor_core_generation  - null when NVIDIA's own page for *that specific
#                             product* doesn't state it (see p4d/p4de below --
#                             not invented from general knowledge).
#   fp32_tflops / fp64_tflops / tf32_tflops / bf16_tflops / fp16_tflops /
#     fp8_tflops / fp4_tflops / int8_tops
#                             - dense Tensor Core performance (sparsity
#                               roughly 2x where NVIDIA publishes it, not
#                               separately recorded here). For the 8-GPU
#                               HGX (B200/B300) and 2-GPU Superchip (GB200)
#                               products, NVIDIA only publishes system-level
#                               aggregate figures -- these are that aggregate
#                               divided by GPU count, not an independently
#                               published per-GPU number; see each entry's
#                               comment.
#   source                  - the exact NVIDIA page these numbers came from.
#
# Used by: gpu_reference.py (fixed path, loaded internally) and
# model_instance_fit.py (loaded once in cli.py's `compare` via
# --gpu-specs-config, passed through explicitly as part of ComparisonDataset).
# Only the first four fields are actually read by code today -- the rest is
# reference/documentation the pipeline doesn't yet consume.
#
# Every top-level key above this point is a live AWS instance *family* (the
# same tokens family_of() produces from a real instance type, and the same
# ones config/aws_instances.yaml tracks) -- that's what makes them
# code-reachable at all. `gb300_nvl72` below is deliberately keyed
# differently: it's real NVIDIA hardware (source-cited, same rigor as
# everything else here) that AWS doesn't offer yet, so it can't take an AWS
# family name without implying otherwise (2026-08-20, user: "keep
# gb300_nvl72... this is from nvidia, just not on aws yet" -- an earlier
# pass had added it as a fabricated "p6e-gb300" family and was reverted for
# exactly that reason). Held in reserve, inert to the code (no AWS instance
# type's family_of() will ever equal "gb300_nvl72"), ready to be re-keyed
# under a real AWS family the day AWS ships one.

gb300_nvl72: # GB300 NVL72 -- NOT an AWS instance family yet, see note above. Rack-scale: 72 Blackwell Ultra GPUs + 36 Grace CPUs, liquid-cooled
  memory_gb_per_gpu: 277.78 # derived: rack's "20 TB" / 72 GPUs
  memory_bandwidth_gbps: 8000.0 # derived: rack's "Up to 576 TB/s" / 72 GPUs -- NVIDIA's own figure is a ceiling ("Up to"), not a guaranteed sustained number
  nvlink_generation: NVLink5
  nvlink_bandwidth_gbps: 1805.6 # derived: rack's "130 TB/s (72-GPU NVLink domain)" / 72 -- matches the other Blackwell entries' 1800.0 to within rounding
  gpu_model: "NVIDIA GB300 NVL72 (Blackwell Ultra)"
  architecture: "Blackwell Ultra (rack-scale, Grace Blackwell Ultra)"
  form_factor: "72-GPU NVL72 rack, fully liquid-cooled"
  tensor_core_generation: "5th generation" # inferred, same Blackwell family as B200/B300/GB200
  # NVIDIA's GB300 NVL72 page only publishes full-rack (72-GPU) aggregate
  # compute figures, no per-superchip-module breakdown like GB200 had --
  # these are the rack-level figure divided by 72.
  fp32_tflops: 83.33 # 6 PFLOPS / 72
  fp64_tflops: 1.39 # 100 TFLOPS / 72
  tf32_tflops: 2500.0 # 180 PFLOPS / 72
  bf16_tflops: 5000.0 # 360 PFLOPS / 72
  fp16_tflops: 5000.0
  fp8_tflops: 10000.0 # 720 PFLOPS / 72
  fp4_tflops: 15000.0 # 1080 PFLOPS dense / 72 (1440 PFLOPS sparse / 72 = 20000)
  int8_tops: 333.33 # 24 POPS / 72
  native_precision_support: [BF16, FP8, FP4, INT8, INT4] # doc 04 §5 SM100 row (Blackwell family)
  source: "https://www.nvidia.com/en-us/data-center/gb300-nvl72/#specs"

