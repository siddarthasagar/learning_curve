  fp16_tflops: 312.0
  fp8_tflops: null # A100 has no FP8 silicon -- NVIDIA's page has no fp8 figure at all, doc 04 §5 fact 1
  fp4_tflops: null
  int8_tops: 624.0
  native_precision_support: [BF16, INT8, INT4] # doc 04 §5 SM80 row
  source: "https://www.nvidia.com/en-us/data-center/a100/#specifications"

