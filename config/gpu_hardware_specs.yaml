  memory_gb_per_gpu: 185.0 # doc 04 §3's own per-GPU figure -- close to but not overridden by NVL72 page's "372 GB / 2 GPUs" (186 GB); independently confirmed exact 2026-08-20 via AWS's own EC2 P6 page (p6e-gb200.36xlarge: "740 HBM3e" / 4 GPUs = 185.0 -- note this specific EC2 instance size bundles 4 GPUs, not the 2-GPU Superchip module the rest of this entry's figures are derived from; per-GPU numbers are unaffected either way, same underlying die)
