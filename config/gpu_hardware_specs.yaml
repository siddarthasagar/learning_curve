  # memory_bandwidth_gbps below is genuinely unconfirmed for this exact
  # form factor. The PCIe-40GB figure (1555 GB/s) exists but is NOT reused
  # here: SXM and PCIe A100s differ in bandwidth at the 80GB tier (2039 vs
  # 1935 GB/s), so borrowing the PCIe number risks misrepresenting SXM4
  # bandwidth. Left null until a source specific to SXM4 40GB is found.
  memory_gb_per_gpu: 40.0
  memory_bandwidth_gbps: null
  nvlink_generation: NVLink3
  nvlink_bandwidth_gbps: 600.0 # SXM4 NVLink capability is a property of the module/interconnect, not memory size -- same as p4de
  gpu_model: "NVIDIA A100"
  architecture: "Ampere"
  form_factor: "SXM4"
  tensor_core_generation: null # not stated on NVIDIA's own A100 page (unlike L40S/H100/RTX PRO 6000, which do state it)
