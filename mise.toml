[tasks.install]
description = "Install production dependencies"
run = "uv sync --no-dev"

[tasks.dev]
description = "Install dev and production dependencies"
depends = ["clean"]
run = "uv sync"

[tasks.update]
description = "Update dependency lockfile"
run = "uv lock --upgrade"

[tasks.format]
description = "Format Python code and apply upgrades"
run = '''
#!/usr/bin/env bash
set -euo pipefail
FILES=$(git ls-files 'src/*.py' 'tests/*.py' 'src/**/*.py' 'tests/**/*.py' 2>/dev/null || find src tests -type f -name "*.py" -not -path "*/.*" -not -path "./venv/*" -not -path "./.venv/*")
uv run ruff check $FILES --fix
uv run pyupgrade --py313-plus $FILES
uv run ruff format $FILES
'''

[tasks.lint]
description = "Lint Python code"
run = '''
#!/usr/bin/env bash
set -euo pipefail
FILES=$(git ls-files 'src/*.py' 'tests/*.py' 'src/**/*.py' 'tests/**/*.py' 2>/dev/null || find src tests -type f -name "*.py" -not -path "*/.*" -not -path "./venv/*" -not -path "./.venv/*")
uv run ruff check $FILES
'''

[tasks.test]
description = "Run the pytest validation suite"
run = "uv run pytest tests/ -q || true"

[tasks.clean]
description = "Remove virtual environment and cached files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
rm -rf .venv .ruff_cache
find . -type d -name "__pycache__" -exec rm -rf {} +
'''

[tasks.run]
description = "Run the Streamlit app"
run = "uv run streamlit run src/markdowns_organizer/app.py"

[tasks.llm-data]
description = "Run the AWS pricing / HuggingFace model size CLI (pass args after --)"
run = "uv run llm-hosting-data"

[tasks.llm-data-pipeline]
description = "Single-entry pipeline: AWS pricing + HF sizes + OpenRouter benchmarks, off the default configs"
run = "uv run llm-hosting-data pipeline"

# ── Graphify (agent knowledge-graph skill) ─────────────────────────────────────

[tasks.graphify-install]
description = "Install graphify skills for Claude Code, Codex, OpenCode, Kilo, Copilot CLI, VS Code Copilot Chat, Antigravity, Pi"
run = '''
#!/usr/bin/env bash
set -euo pipefail
graphify claude install
graphify codex install
graphify opencode install
graphify kilo install
graphify copilot install
graphify vscode install
graphify antigravity install
graphify pi install
'''

[tasks.graphify-uninstall]
description = "Remove graphify skills for all agents (global)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
graphify claude uninstall
graphify codex uninstall
graphify opencode uninstall
graphify kilo uninstall
graphify copilot uninstall
graphify vscode uninstall
graphify antigravity uninstall
graphify pi uninstall
'''

[tasks.graphify]
description = "Reinstall graphify skills for all agents (uninstall, then install)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run graphify-uninstall
mise run graphify-install
'''

[tasks.graphify-refresh]
description = "Re-extract changed code into the graph (AST only, no LLM, no tokens)"
run = "graphify update ."

[tasks.graphify-viz]
description = "Regenerate graph visualization and report from graphify-out"
run = "graphify cluster-only ."
